<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b3a">
<title>بوخلي Restaurant | المنيو</title>
<style>
:root{--green:#173b3a;--green2:#214846;--orange:#f3a36e;--cream:#fff8ef;--ink:#172b2a;--muted:#687573;--line:#e8e0d5}
*{box-sizing:border-box} body{margin:0;background:#f3eee6;color:var(--ink);font-family:Arial,"Noto Sans Arabic",sans-serif}
header{background:var(--green);color:#fff;padding:28px 18px 22px;text-align:center;border-bottom:5px solid var(--orange)}
.brand{font-size:clamp(28px,7vw,42px);font-weight:800;letter-spacing:.2px;color:#fff3e7}
.brand-en{font-size:13px;letter-spacing:4px;margin-top:5px;color:#f4c4a2}
.sub{margin:12px 0 0;color:#f8e8dc;font-size:14px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px auto 0}
button{border:1px solid #f3c7a7;background:transparent;color:#fff;padding:9px 14px;border-radius:24px;font-weight:700;cursor:pointer}
button.active{background:var(--orange);border-color:var(--orange);color:#173b3a}
main{max-width:920px;margin:0 auto;padding:18px 14px 42px}
.note{text-align:center;color:var(--muted);font-size:13px;margin:0 0 16px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:thin}
nav a{white-space:nowrap;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--green);padding:9px 13px;border-radius:22px;font-size:13px;font-weight:700}
section{background:var(--cream);border:1px solid var(--line);border-radius:16px;margin:0 0 14px;padding:17px 16px;box-shadow:0 3px 12px #173b3a0a;scroll-margin-top:12px}
h2{margin:0 0 12px;font-size:20px;color:var(--green);display:flex;align-items:center;gap:9px}
h2:before{content:"";display:inline-block;width:5px;height:22px;background:var(--orange);border-radius:5px}
.item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed #ded5c8;align-items:flex-start}
.item:last-child{border-bottom:0;padding-bottom:0}.names{min-width:0}.ar{font-weight:700;font-size:15px}.en{font-size:12px;color:var(--muted);margin-top:4px;direction:ltr;text-align:right}
.price{font-weight:800;color:#a9532b;white-space:nowrap;font-size:14px;padding-top:2px}
footer{text-align:center;background:var(--green);color:#f8e8dc;padding:20px;font-size:12px} .hidden{display:none}
body.english{direction:ltr}body.english .en{display:none}body.english .ar{font-weight:700}body.english .item{direction:ltr}body.english h2{direction:ltr}body.english h2:before{order:-1}body.english .price{text-align:right}
@media(min-width:700px){main{padding-top:24px} .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.menu-grid section{margin:0}.menu-grid section.wide{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <div class="brand">بوخلي</div><div class="brand-en">RESTAURANT</div>
  <p class="sub" data-ar="منيو المطعم" data-en="Restaurant Menu">منيو المطعم</p>
  <div class="controls">
    <button id="arBtn" class="active" onclick="setLang('ar')">العربية</button>
    <button id="enBtn" onclick="setLang('en')">English</button>
  </div>
</header>
<main>
<p class="note" data-ar="الأسعار بالدينار الكويتي ما لم يُذكر غير ذلك." data-en="Prices are in Kuwaiti dinars unless otherwise noted.">الأسعار بالدينار الكويتي ما لم يُذكر غير ذلك.</p>
<nav id="nav"></nav>
<div class="menu-grid" id="menu"></div>
</main>
<footer>بوخلي Restaurant · أهلاً وسهلاً بكم</footer>

let lang='ar';
function setLang(next){lang=next;document.body.classList.toggle('english',lang==='en');document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('arBtn').classList.toggle('active',lang==='ar');document.getElementById('enBtn').classList.toggle('active',lang==='en');document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang]);render()}
function render(){
 const nav=document.getElementById('nav'), menu=document.getElementById('menu');nav.innerHTML='';menu.innerHTML='';
 sections.forEach((s,i)=>{
  const id='section-'+i;
  const a=document.createElement('a');a.href='#'+id;a.textContent=s[lang];nav.appendChild(a);
  const sec=document.createElement('section');sec.id=id;if(i===0||i===1)sec.classList.add('wide');
  const h=document.createElement('h2');h.textContent=s[lang];sec.appendChild(h);
  s.items.forEach(item=>{const row=document.createElement('div');row.className='item';const names=document.createElement('div');names.className='names';
   const ar=document.createElement('div');ar.className='ar';ar.textContent=item[lang==='ar'?0:1];
   const en=document.createElement('div');en.className='en';en.textContent=item[lang==='ar'?1:0];
   names.append(ar,en);const price=document.createElement('div');price.className='price';price.textContent=item[2]+' KD';row.append(names,price);sec.appendChild(row);
  });menu.appendChild(sec);
 });
}
render();
